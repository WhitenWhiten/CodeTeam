[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeteam-runtime"
version = "0.2.0"
description = "Dependency-aware multi-agent Python repository generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "jsonschema>=4", "openai>=1", "pytest>=7", "numpy>=1.24"]

[project.optional-dependencies]
rag = ["sentence-transformers", "faiss-cpu"]
analysis = ["pandas", "openpyxl", "scipy"]

[project.scripts]
codeteam = "app.main:main"

[tool.setuptools]
packages = ["app", "actions", "core", "orchestrator", "roles", "runtime_adapters", "utils", "rag", "prompts"]

[tool.setuptools.package-data]
prompts = ["*.md"]
